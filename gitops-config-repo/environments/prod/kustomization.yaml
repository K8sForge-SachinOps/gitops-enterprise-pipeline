apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

configMapGenerator:
  - name: env-config
    behavior: create
    envs:
      - prod-config.yaml

patches:
  - target:
      kind: Service
      name: nginx-gateway-service
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30082

images:
  - name: dev-registry:5000/core-api
    newName: dev-registry:5000/core-api
    newTag: prod-v1.0.0
  - name: dev-registry:5000/nginx-gateway
    newName: dev-registry:5000/nginx-gateway
    newTag: prod-v1.0.0

commonLabels:
  environment: prod
  managed-by: gitops-pull-reconciler
