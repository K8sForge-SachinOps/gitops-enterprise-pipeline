apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uat

resources:
  - ../../base

configMapGenerator:
  - name: env-config
    behavior: create
    envs:
      - uat-config.yaml

patches:
  - target:
      kind: Service
      name: nginx-gateway-service
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081

images:
  - name: dev-registry:5000/core-api
    newName: dev-registry:5000/core-api
    newTag: f2eba78
  - name: dev-registry:5000/nginx-gateway
    newName: dev-registry:5000/nginx-gateway
    newTag: f2eba78

commonLabels:
  environment: uat
  managed-by: gitops-pull-reconciler
