apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

configMapGenerator:
  - name: env-config
    behavior: create
    envs:
      - dev-config.yaml

images:
  - name: dev-registry:5000/core-api
    newName: dev-registry:5000/core-api
    newTag: 01c05d0
  - name: dev-registry:5000/nginx-gateway
    newName: dev-registry:5000/nginx-gateway
    newTag: 01c05d0

commonLabels:
  environment: dev
  managed-by: gitops-pull-reconciler
