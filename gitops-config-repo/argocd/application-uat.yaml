apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enterprise-platform-uat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'git://172.18.0.1:9418/gitops.git'
    targetRevision: main
    path: environments/uat
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
