apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-scripts
data:
  init-mongo.js: |
    db = db.getSiblingDB('enterprise_db');
    db.createCollection('deployments');
    db.deployments.insertOne({
        service: "gitops-pipeline",
        environment: "dev",
        timestamp: new Date(),
        status: "initialized",
        compliance: "State Data Centre SDC-01"
    });
    print(">> [MongoDB-Init] Enterprise database seeded successfully.");
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: "enterprise_db"
        volumeMounts:
        - name: mongo-init-volume
          mountPath: /docker-entrypoint-initdb.d
        - name: mongo-storage
          mountPath: /data/db
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
      volumes:
      - name: mongo-init-volume
        configMap:
          name: mongodb-init-scripts
      - name: mongo-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
    name: mongodb
