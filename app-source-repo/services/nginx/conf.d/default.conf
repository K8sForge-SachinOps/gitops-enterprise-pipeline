server {
    listen 80;
    server_name localhost;

    # Kubernetes CoreDNS resolver
    resolver 10.96.0.10 valid=10s ipv6=off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx-gateway"}\n';
        add_header Content-Type application/json;
    }

    # Static portal
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to core-api microservice (FQDN in cluster)
    location /api/ {
        set $core_api_backend "http://core-api-service.default.svc.cluster.local:8000";
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $core_api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy to Grafana
    location /grafana/ {
        set $grafana_backend http://grafana-service.default.svc.cluster.local:3000;
        proxy_pass $grafana_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy to Airflow
    location /airflow/ {
        set $airflow_backend http://airflow-service.default.svc.cluster.local:8080;
        proxy_pass $airflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
